<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>邮件管理 · SIPC 十六周年</title>
<link rel="stylesheet" href="admin-base.css"><link rel="stylesheet" href="admin-ui.css"><link rel="stylesheet" href="admin-mail.css"></head><body>
<svg style="display:none" aria-hidden="true"><defs>
<symbol id="grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
<symbol id="award" viewBox="0 0 24 24"><circle cx="12" cy="8" r="5"/><path d="m8 12-2 9 6-3 6 3-2-9"/></symbol>
<symbol id="users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 4v2"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></symbol>
<symbol id="box" viewBox="0 0 24 24"><path d="m12 3 9 5v9l-9 5-9-5V8l9-5zm-9 5 9 5 9-5m-9 5v9M7.5 5.5l9 5"/></symbol>
<symbol id="mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></symbol>
<symbol id="download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4"/></symbol>
<symbol id="refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6 6a8 8 0 0 1 14 6M18 18A8 8 0 0 1 4 12"/></symbol>
<symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-9v.1"/></symbol>
<symbol id="left" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
<symbol id="right" viewBox="0 0 24 24"><path d="m10 6 6 6-6 6"/></symbol>
<symbol id="exit" viewBox="0 0 24 24"><path d="M9 4H4v16h5m4-12 4 4-4 4m-4-4h12"/></symbol>
</defs></svg>
<aside class="sidebar"><div class="brand"><div class="mark"><svg viewBox="0 0 32 32"><path d="m9 8-5 8 5 8m14-16 5 8-5 8M19 6l-6 20" stroke-width="2.8"/></svg></div><div><strong>SIPC · 16</strong><small>ANNIVERSARY</small></div></div>
<div class="nav-label">内容管理</div><a class="nav" href="admin-registration.html"><svg><use href="#grid"/></svg><span>报名管理</span></a><a class="nav" href="admin-honors.html"><svg><use href="#award"/></svg><span>荣誉墙</span></a>
<a class="nav active" href="admin-mail.html" aria-current="page"><svg><use href="#mail"/></svg><span>邮件管理</span></a>
<div class="side-note"><strong>十六周年 · 再次相聚</strong>每一份回执，都是一次期待。</div><div class="account"><div class="avatar">管</div><div><div class="name">管理员</div><small>成员账户</small></div><button class="exit" aria-label="退出登录" data-label="退出登录"><svg><use href="#exit"/></svg></button></div></aside>
<div class="shell"><header class="topbar"><div class="breadcrumbs">管理工作台 <span>/</span><b>邮件管理</b></div><div class="top-right"><div class="preview-label"><span></span>原型预览</div><span>SIPC 十六周年邀请函</span></div></header><main>
<div class="page-head"><div><h1>邮件管理</h1><p>编辑内容、选择收件人，在确认后寄出每一份心意。</p></div><button class="btn" id="mail-history"><svg><use href="#mail"/></svg>发送记录</button></div>
<div class="mail-modebar"><div class="mail-modes" role="tablist" aria-label="邮件发送模式"><button class="mail-mode active" id="single-mode" role="tab" aria-selected="true">单发模式</button><button class="mail-mode" id="bulk-mode" role="tab" aria-selected="false">群发模式</button></div><span class="mail-mode-hint" id="mode-description">为每位报名者分别编辑邮件内容</span></div>
<div class="mail-workspace">
<section class="mail-side" aria-label="选择收件人"><div class="mail-panel-title"><span>选择报名者</span><span class="count" id="recipient-count">24</span></div>
<div class="recipient-filters"><div class="input-wrap"><svg><use href="#search"/></svg><input id="recipient-search" placeholder="搜索姓名、手机号或邮箱" aria-label="搜索收件人"></div>
<div class="recipient-filter-row"><select id="recipient-attendance" aria-label="到场状态筛选"><option value="">全部到场状态</option><option value="ATTENDING">到场</option><option value="NOT_ATTENDING">不到场</option></select><select id="recipient-gift" aria-label="领取方式筛选"><option value="">全部领取方式</option><option value="PICKUP">到场领取</option><option value="MAIL">邮寄</option><option value="NONE">不领取</option></select></div></div>
<div class="recipient-tools" id="selection-tools" hidden><label><input type="checkbox" id="select-filtered">选择筛选结果</label><button id="clear-selection">清空已选</button></div>
<div class="recipient-list" id="recipient-list"></div>
</section>
<section class="mail-compose" aria-label="邮件编辑器">
<div class="mail-panel-title"><span id="compose-title">编辑专属邮件</span><span class="help" id="draft-state">草稿仅保存在本机</span></div>
<div class="mail-context" id="mail-context"></div>
<div class="compose-body">
<div class="form-field"><label class="editor-label" for="compose-subject"><span>邮件主题<span class="required">*</span></span><span class="help" id="subject-count">0 / 200</span></label><input id="compose-subject" maxlength="200" placeholder="请输入邮件主题"><span class="field-error" id="subject-error"></span></div>
<div class="variable-box" id="variable-box" hidden><p>点击插入变量，发送时会替换成每位报名者的信息。</p><div class="variable-chips"><button class="variable-chip" data-variable="name">姓名<code>{{name}}</code></button><button class="variable-chip" data-variable="attendance">是否到场<code>{{attendance}}</code></button><button class="variable-chip" data-variable="giftChoice">礼物方式<code>{{giftChoice}}</code></button><button class="variable-chip" data-variable="id">回执编号<code>{{id}}</code></button></div></div>
<div class="form-field"><label class="editor-label" for="compose-body"><span id="body-label">邮件正文<span class="required">*</span></span><span class="help" id="body-count">0 字</span></label><textarea id="compose-body" maxlength="10000" placeholder="写下想对这位报名者说的话……"></textarea><span class="field-error" id="body-error"></span></div>
</div>
<div class="note compose-alert" id="compose-note">单发内容可逐人编辑；切换收件人时，将保留各自的本机草稿。</div>
<div class="compose-foot"><span class="help" id="send-summary"></span><div class="compose-actions"><button class="btn" id="save-draft">保存草稿</button><button class="btn primary" id="preview-mail"><svg><use href="#mail"/></svg>预览并确认</button></div></div>
</section></div>
<div class="page-foot"><span>SIPC · 十六周年邀请函管理平台</span><span>交互原型 · 不会发送真实邮件</span></div>
</main></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="prototype-store.js"></script><script src="admin-common.js"></script><script src="admin-mail.js"></script>
</body></html>
