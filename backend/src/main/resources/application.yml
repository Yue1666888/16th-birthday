spring:
  application:
    name: birthday16-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:file:.env[.properties]
  sql:
    init:
      mode: never
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:birthday16_dev}?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:16620}
mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{X-Request-ID:-}] %logger{36} - %msg%n"
app:
  security:
    issuer: ${KEYCLOAK_URL:https://sso.sipc115.com}/realms/${KEYCLOAK_REALM:member}
    jwk-set-uri: ${KEYCLOAK_URL:https://sso.sipc115.com}/realms/${KEYCLOAK_REALM:member}/protocol/openid-connect/certs
    audience: ${ADMIN_API_AUDIENCE:account}
  cors:
    origins: ${APP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
  limits:
    invitation-per-minute: ${RATE_LIMIT_REQUESTS_PER_MINUTE:10}
